kind = "web"
previewPath = "/"
title = "Roblox Prank Page"
description = "Una experiencia web de Robux con selección de paquetes, idiomas, monedas y flujo de compra simulado para demostración."
version = "1.0.0"
id = "artifacts/roblox-prank"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18171

[services.development]
run = "pnpm --filter @workspace/roblox-prank run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/roblox-prank", "run", "build" ]
serve = "static"
publicDir = "artifacts/roblox-prank/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18171"
BASE_PATH = "/"
